* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(
            ellipse at 50% 35%,
            rgba(255, 153, 35, 0.13) 0%,
            rgba(180, 100, 20, 0.07) 30%,
            transparent 65%
        ),
        radial-gradient(circle at center, #202020, #080808 75%);

    font-family: Arial, Helvetica, sans-serif;

    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 600px;
    padding: 35px 20px;
}

.logo {
    width: 175px;
    height: 175px;
    object-fit: contain;
    display: block;
    margin: 0 auto 10px;
    filter: drop-shadow(0 0 22px rgba(255, 157, 45, 0.22));
}

.bones {
    display: flex;
    justify-content: center;
    gap: 35px;
    margin: 10px 0 25px;
}

.bone {
    font-size: 30px;
    display: inline-block;
    animation: spinBone 2s linear infinite;
}

.bone:nth-child(2) {
    animation-direction: reverse;
    animation-delay: .3s;
}

@keyframes spinBone {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

h1 {
    font-size: 34px;
    letter-spacing: 6px;

    margin: 25px 0;

    letter-spacing: 3px;
    color: #ffbd62;
}

.status-light {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ffad42;
    box-shadow: 0 0 14px #ffad42;
}

}

    font-size: 23px;
    color: #ffc16b;
}

.panel p {
    color: #aaa;

    font-size: 14px;
}

.checks {

    text-align: left;
}
