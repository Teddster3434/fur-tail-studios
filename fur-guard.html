<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fur-Guard | Security Verification</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #202020, #080808 75%);
    color: #e5e5e5;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 550px;
    padding: 40px 25px;
}

.logo {
    width: 170px;
    height: 170px;
    object-fit: contain;
    margin-bottom: 20px;
}

h1 {
    font-size: 32px;
    letter-spacing: 5px;
}

.subtitle {
    color: #aaa;
    letter-spacing: 2px;
    font-size: 12px;
    margin-bottom: 35px;
}

.status {
    font-size: 12px;
    letter-spacing: 3px;
    margin: 25px 0;
}

.status-light {
    display: inline-block;
    width: 9px;
    height: 9px;
    background: #bbb;
    border-radius: 50%;
    margin-right: 9px;
}

.panel {
    background: rgba(255,255,255,0.04);
    border: 1px solid #383838;
    border-radius: 12px;
    padding: 30px 20px;
    min-height: 180px;
}

.panel p {
    color: #aaa;
    line-height: 1.6;
}

button {
    background: linear-gradient(135deg, #ddd, #888);
    color: #111;
    border: none;
    border-radius: 5px;
    padding: 14px 24px;
    margin-top: 20px;
    font-weight: bold;
    cursor: pointer;
}

input {
    width: 140px;
    padding: 13px;
    font-size: 20px;
    text-align: center;
    border: 1px solid #777;
    border-radius: 5px;
    background: #111;
    color: white;
}

footer {
    margin-top: 45px;
    color: #777;
    font-size: 10px;
    letter-spacing: 2px;
    line-height: 2;
}

footer strong {
    color: #bbb;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<main class="container">

    <img
        id="wolf"
        class="logo"
        src="assets/fur-guard-silver.png"
        alt="Fur-Guard silver wolf emblem"
    >

    <h1>FUR-GUARD</h1>

    <div class="subtitle">
        24H SAFETY THAT NEVER STOPS
    </div>

    <div class="status" aria-live="polite">
        <span class="status-light" id="statusLight"></span>
        <span id="statusText">INITIALISING</span>
    </div>

    <section class="panel" id="panel" aria-live="polite">
        <h2>We need to run our checks.</h2>
        <p>We won't be a moment.</p>
    </section>

    <footer>
        <strong>FUR-GUARD SYSTEMS ACTIVE</strong><br>
        24H SAFETY THAT NEVER STOPS<br><br>
        POWERED BY FUR-TAIL STUDIOS
    </footer>

</main>

<!-- FUR-GUARD SECURITY ENGINE -->
<script src="js/fur-guard.js" defer></script>

</body>
</html>
