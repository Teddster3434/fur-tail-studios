<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Fur-Guard | Security Verification</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #252525, #080808 75%);
    color: #e5e5e5;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 600px;
    padding: 35px 20px;
}

.logo {
    width: 175px;
    height: 175px;
    object-fit: contain;
    display: block;
    margin: 0 auto 10px;
}

.bones {
    display: flex;
    justify-content: center;
    gap: 35px;
    margin: 10px 0 25px;
}

.bone {
    font-size: 30px;
    display: inline-block;
    animation: spinBone 2s linear infinite;
}

.bone:nth-child(2) {
    animation-direction: reverse;
    animation-delay: .3s;
}

@keyframes spinBone {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

h1 {
    font-size: 34px;
    letter-spacing: 6px;
    margin: 10px 0;
}

.subtitle {
    color: #999;
    font-size: 11px;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

.status {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 25px 0;
    font-size: 12px;
    letter-spacing: 3px;
    color: #ccc;
}

.status-light {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #bbb;
    box-shadow: 0 0 12px #bbb;
}

.panel {
    background: rgba(255,255,255,.045);
    border: 1px solid #393939;
    border-radius: 14px;
    padding: 35px 25px;
    min-height: 190px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
}

.panel h2 {
    font-size: 23px;
    color: #eee;
}

.panel p {
    color: #aaa;
    line-height: 1.7;
    font-size: 14px;
}

.loading {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 25px 0;
}

.loading span {
    width: 8px;
    height: 8px;
    background: #bbb;
    border-radius: 50%;
    animation: pulse 1.2s infinite ease-in-out;
}

.loading span:nth-child(2) {
    animation-delay: .2s;
}

.loading span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes pulse {
    0%, 80%, 100% {
        opacity: .3;
        transform: scale(.8);
    }
    40% {
        opacity: 1;
        transform: scale(1.2);
    }
}

footer {
    margin-top: 40px;
    color: #777;
    font-size: 10px;
    letter-spacing: 2px;
    line-height: 2.2;
}

footer strong {
    color: #bbb;
}

.legal-notice {
    margin-top: 30px;
    padding: 14px;
    border: 1px solid #383838;
    border-radius: 8px;
    color: #888;
    font-size: 10px;
    line-height: 1.8;
}

.legal-notice strong {
    color: #bbb;
}

button {
    padding: 12px 24px;
    border: 1px solid #777;
    border-radius: 5px;
    background: #bbb;
    color: #111;
    cursor: pointer;
    font-weight: bold;
}

button:focus-visible {
    outline: 3px solid #ffad42;
    outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {
    .bone, .loading span {
        animation: none;
    }
}

@media (max-width: 480px) {
    .logo {
        width: 145px;
        height: 145px;
    }

    h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<main class="container">

    <!-- FUR-GUARD WOLF -->
    <img
        id="wolf"
        class="logo"
        src="assets/fur-guard-emblem.png"
        alt="Fur-Guard wolf emblem"
    >

    <!-- SPINNING BONES -->
    <div class="bones" aria-label="Fur-Guard loading animation">
        <span class="bone" aria-hidden="true">🦴</span>
        <span class="bone" aria-hidden="true">🦴</span>
    </div>

    <h1>FUR-GUARD</h1>

    <div class="subtitle">
        24H SAFETY THAT NEVER STOPS
    </div>

    <!-- SECURITY STATUS -->
    <div class="status" aria-live="polite">
        <span class="status-light" id="statusLight"></span>
        <span id="statusText">INITIALISING</span>
    </div>

    <!-- VERIFICATION PANEL -->
    <section class="panel" id="panel" aria-live="polite" aria-atomic="true">
        <h2>We need to run our checks.</h2>
        <p>We won't be a moment.</p>

        <div class="loading" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </section>

    <footer>
        <strong>FUR-GUARD SYSTEMS ACTIVE</strong>
        <br>
        24H SAFETY THAT NEVER STOPS
        <br><br>
        POWERED BY FUR-TAIL STUDIOS
    </footer>

    <div class="legal-notice">
        <strong>PAWSLVANIA SECURITY NOTICE</strong>
        <br>
        "In pawslvania touching this is a FEDARAL crime and WILL remove your treets"
    </div>

</main>

<!-- FUR-GUARD SECURITY ENGINE -->
<script src="js/fur-guard.js" defer></script>

</body>
</html>
