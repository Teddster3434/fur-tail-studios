<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fur-Guard | Security Verification</title>

    <meta name="theme-color" content="#080808">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at center, #202020 0%, #090909 65%, #000000 100%);

            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;
        }

        /* BACKGROUND */

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(circle at center,
                transparent 0%,
                rgba(0,0,0,0.65) 100%);
        }

        /* MAIN CONTAINER */

        .container {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 650px;

            padding: 40px 25px;

            text-align: center;
        }

        /* WOLF LOGO */

        .logo {
            width: 190px;
            height: 190px;

            object-fit: contain;

            margin-bottom: 12px;

            filter: drop-shadow(0 0 18px rgba(200,200,200,0.3));

            animation: logoGlow 4s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(200,200,200,0.2));
            }

            50% {
                filter: drop-shadow(0 0 25px rgba(220,220,220,0.55));
            }
        }

        /* BRAND NAME */

        h1 {
            font-size: clamp(32px, 7vw, 52px);

            letter-spacing: 9px;

            color: #eeeeee;

            text-shadow: 0 0 20px rgba(255,255,255,0.2);

            margin-bottom: 12px;
        }

        .subtitle {
            color: #888;

            font-size: 11px;

            letter-spacing: 5px;

            margin-bottom: 35px;
        }

        /* SPINNING BONES */

        .bones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;

            margin: 35px auto 50px;
        }

        .bone {
            width: 65px;
            height: 65px;

            animation: spin 3s linear infinite;

            filter: drop-shadow(0 0 10px rgba(255,255,255,0.25));
        }

        .bone:nth-child(2) {
            animation-direction: reverse;
            animation-duration: 3.8s;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* VERIFICATION TEXT */

        .verification {
            margin-top: 15px;
        }

        .verification h2 {
            font-size: clamp(19px, 4vw, 25px);

            font-weight: 500;

            color: #eeeeee;

            margin-bottom: 15px;
        }

        .verification p {
            color: #999;

            font-size: 15px;

            line-height: 1.7;
        }

        /* STATUS */

        .status {
            margin: 40px auto 0;

            display: inline-flex;
            align-items: center;
            gap: 12px;

            padding: 13px 25px;

            border: 1px solid #444;
            border-radius: 5px;

            background: rgba(255,255,255,0.035);

            color: #cccccc;

            font-size: 12px;
            letter-spacing: 3px;
        }

        .status-light {
            width: 9px;
            height: 9px;

            background: #bdbdbd;

            border-radius: 50%;

            box-shadow: 0 0 12px #ffffff;

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* FOOTER */

        footer {
            margin-top: 85px;
        }

        footer h3 {
            font-size: 12px;

            letter-spacing: 3px;

            color: #d0d0d0;

            margin-bottom: 10px;
        }

        footer p {
            font-size: 12px;

            color: #777;

            letter-spacing: 1px;
        }

        .copyright {
            margin-top: 25px;

            font-size: 10px;

            color: #555;

            letter-spacing: 2px;
        }

        /* ACCESSIBILITY */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                scroll-behavior: auto !important;
            }
        }

        @media (max-width: 480px) {

            .logo {
                width: 155px;
                height: 155px;
            }

            h1 {
                letter-spacing: 6px;
            }

            .bones {
                gap: 20px;
            }

            .bone {
                width: 52px;
                height: 52px;
            }

            footer {
                margin-top: 65px;
            }
        }

    </style>

</head>

<body>

    <div class="background"></div>

    <main class="container">

        <!-- FUR-GUARD LOGO -->

        <img
            src="assets/fur-guard-emblem.png"
            alt="Fur-Guard wolf emblem"
            class="logo"
        >

        <!-- BRANDING -->

        <h1>FUR-GUARD</h1>

        <div class="subtitle">
            SECURITY SYSTEMS
        </div>

        <!-- SPINNING BONES -->

        <div class="bones" aria-hidden="true">

            <!-- Bone one -->

            <svg class="bone" viewBox="0 0 100 100">
                <path
                    d="M24 19
                       C8 4 0 24 15 35
                       L65 85
                       C76 100 96 85 82 70
                       L32 20
                       C30 18 27 18 24 19Z"
                    fill="#dedede"
                    stroke="#777"
                    stroke-width="3"
                />
                <path
                    d="M24 19 L82 77"
                    stroke="#ffffff"
                    stroke-width="3"
                    opacity="0.45"
                />
            </svg>

            <!-- Bone two -->

            <svg class="bone" viewBox="0 0 100 100">
                <path
                    d="M24 19
                       C8 4 0 24 15 35
                       L65 85
                       C76 100 96 85 82 70
                       L32 20
                       C30 18 27 18 24 19Z"
                    fill="#dedede"
                    stroke="#777"
                    stroke-width="3"
                />
                <path
                    d="M24 19 L82 77"
                    stroke="#ffffff"
                    stroke-width="3"
                    opacity="0.45"
                />
            </svg>

        </div>

        <!-- VERIFICATION MESSAGE -->

        <div class="verification">

            <h2>
                We need to run our checks.
            </h2>

            <p>
                We won't be a moment.
            </p>

        </div>

        <!-- STATUS -->

        <div class="status" role="status" aria-live="polite">

            <span class="status-light"></span>

            INITIALISING

        </div>

        <!-- FOOTER -->

        <footer>

            <h3>FUR-GUARD SYSTEMS ACTIVE</h3>

            <p>
                24h safety that never stops
            </p>

            <div class="copyright">
                POWERED BY FUR-TAIL STUDIOS
            </div>

        </footer>

    </main>

</body>

</html>
